apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openldap
  namespace: curity-dev
spec:
  serviceName: "openldap-service"
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "openldap-role-dev"

        # Admin wachtwoord
        vault.hashicorp.com/agent-inject-secret-admin-pass: "secret/data/dev/openldap/vars"
        vault.hashicorp.com/agent-inject-template-admin-pass: |
          {{- with secret "secret/data/dev/openldap/vars" -}}
          {{ .Data.data.ADMIN_PASSWORD }}
          {{- end -}}

        # TLS certificaat
        vault.hashicorp.com/agent-inject-secret-tls-cert: "secret/data/dev/openldap/tls"
        vault.hashicorp.com/agent-inject-template-tls-cert: |
          {{- with secret "secret/data/dev/openldap/tls" -}}
          {{ .Data.data.cert }}
          {{- end -}}

        # TLS private key
        vault.hashicorp.com/agent-inject-secret-tls-key: "secret/data/dev/openldap/tls"
        vault.hashicorp.com/agent-inject-template-tls-key: |
          {{- with secret "secret/data/dev/openldap/tls" -}}
          {{ .Data.data.key }}
          {{- end -}}

        # CA certificaat
        vault.hashicorp.com/agent-inject-secret-tls-ca: "secret/data/dev/openldap/tls"
        vault.hashicorp.com/agent-inject-template-tls-ca: |
          {{- with secret "secret/data/dev/openldap/tls" -}}
          {{ .Data.data.ca }}
          {{- end -}}

    spec:
      securityContext:
        fsGroup: 911
      serviceAccountName: openldap-sa

      initContainers:
        - name: cert-setup
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /vault/secrets/tls-cert /tls/ldap.crt
              cp /vault/secrets/tls-key /tls/ldap.key
              cp /vault/secrets/tls-ca /tls/ca.crt
              chmod 640 /tls/ldap.key
              chmod 644 /tls/ldap.crt /tls/ca.crt
              echo "TLS certificaten gekopieerd naar /tls/"
          volumeMounts:
            - name: tls-certs
              mountPath: /tls

      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          command: ["container/tool/run"]
          args: ["--copy-service"]
          ports:
            - containerPort: 389
              name: ldap
            - containerPort: 636
              name: ldaps
          env:
            - name: LDAP_LOG_LEVEL
              value: "256"
            - name: LDAP_ORGANISATION
              value: "Camazotz"
            - name: LDAP_DOMAIN
              value: "camazotz.me"
            - name: LDAP_ADMIN_PASSWORD_FILE
              value: "/vault/secrets/admin-pass"
            - name: LDAP_CONFIG_PASSWORD_FILE
              value: "/vault/secrets/admin-pass"
            - name: LDAP_REPLICATION
              value: "false"
            - name: LDAP_WAIT_FOR_HOSTS
              value: "false"
            # TLS inschakelen
            - name: LDAP_TLS
              value: "true"
            - name: LDAP_TLS_CRT_FILENAME
              value: "ldap.crt"
            - name: LDAP_TLS_KEY_FILENAME
              value: "ldap.key"
            - name: LDAP_TLS_CA_CRT_FILENAME
              value: "ca.crt"
            - name: LDAP_TLS_VERIFY_CLIENT
              value: "never"
            - name: LDAP_TLS_CIPHER_SUITE
              value: "NORMAL"
          volumeMounts:
            - name: ldap-storage
              mountPath: /var/lib/ldap
              subPath: data
            - name: ldap-storage
              mountPath: /etc/ldap/slapd.d
              subPath: config
            - name: tls-certs
              mountPath: /container/service/slapd/assets/certs

      volumes:
        - name: tls-certs
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: ldap-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: openldap-service
  namespace: curity-dev
spec:
  selector:
    app: openldap
  ports:
    - name: ldap
      port: 389
      targetPort: 389
    - name: ldaps
      port: 636
      targetPort: 636

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openldap-sa
  namespace: curity-dev